name: Stundenplan aktualisieren

on:
  schedule:
    - cron: "17 3 * * *"   # täglich ca. 05:17 Uhr deutscher Zeit
  workflow_dispatch:        # manuell über "Run workflow"
  push:
    branches: [main]
    paths: ["docs/**", "config.toml", "stundenplan.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stundenplan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Termine abrufen
        # Schlägt der Abruf fehl, wird die letzte gute .ics trotzdem veröffentlicht
        id: abruf
        continue-on-error: true
        run: python stundenplan.py

      - name: Änderungen committen
        if: steps.abruf.outcome == 'success'
        run: |
          git config user.name "stundenplan-bot"
          git config user.email "stundenplan-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Stundenplan aktualisiert $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Abruf-Fehler melden
        if: steps.abruf.outcome != 'success'
        run: |
          echo "::error::Abruf aus AlmaWeb fehlgeschlagen – alte Version bleibt online. Log oben prüfen."
          exit 1
